name: Release
on:
  release:
    types: [published]

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bart push
        env:
          BART_REGISTRY_USER: ${{ secrets.BART_REGISTRY_USER }}
          BART_REGISTRY_TOKEN: ${{ secrets.BART_REGISTRY_TOKEN }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e BART_REGISTRY_USER \
            -e BART_REGISTRY_TOKEN \
            cr.flecs.tech/flecs/bart:latest \
            push --version "${GITHUB_REF_NAME}"
