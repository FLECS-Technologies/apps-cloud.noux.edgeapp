services:
  nc-edge:
    image: read.dev.registry.noux.cloud/nc_edge:2.4.1
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      NC_SERIAL: ${NC_SERIAL:?<error message>}
      NC_HARDWARE: ${NC_HARDWARE:?<error message>}
    ports:
      - "${WEB_UI:-1337}:1337"
    volumes:
      - nouxcloud-app-data:/app/data

volumes:
  nouxcloud-app-data:
